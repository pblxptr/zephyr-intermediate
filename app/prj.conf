CONFIG_LOG=y
CONFIG_THREAD_NAME=y

CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# The 350 ms subscriber cannot keep up with the 100 ms publisher.
# Reserve all SENSOR_COUNT (18) samples plus two buffers of publishing
# headroom, so even a delayed subscriber cannot exhaust the pool.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=20
